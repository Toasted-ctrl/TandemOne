server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # index.html (and version.json) must always be revalidated so new deploys are picked up;
    # hashed files under /assets/ are cached forever below
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
