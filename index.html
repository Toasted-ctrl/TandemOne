<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Tandem One" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0b" />
    <title>Tandem One</title>
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash (see src/theme.ts)
      (function () {
        var t = localStorage.getItem('theme')
        var styled = { funky: '#12052a', terminal: '#050806' }[t]
        var dark = !!styled || t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
        if (styled) document.documentElement.classList.add(t)
        document.querySelector('meta[name="theme-color"]').setAttribute('content', styled || (dark ? '#0a0a0b' : '#f6f5f2'))
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
